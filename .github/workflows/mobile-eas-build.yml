name: Mobile - Android Build (Gradle APK)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Tipo de build'
        type: choice
        options: [preview, production, development]
        default: preview

  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: mobile-gradle-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: InfraCow-Mobile

    env:
      PROFILE: ${{ inputs.profile || 'production' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: InfraCow-Mobile/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci

      - name: Validar perfil
        run: |
          if [[ "$PROFILE" != "preview" &&
                "$PROFILE" != "production" &&
                "$PROFILE" != "development" ]]; then
            echo "::error::Perfil inválido: $PROFILE"
            exit 1
          fi

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Configurar Gradle
        working-directory: InfraCow-Mobile/android
        run: chmod +x gradlew

      - name: Gerar APK
        working-directory: InfraCow-Mobile/android
        run: |
          if [ "$PROFILE" = "production" ]; then
            echo "Gerando APK Release..."
            ./gradlew assembleRelease
          else
            echo "Gerando APK Debug..."
            ./gradlew assembleDebug
          fi

      - name: Armazenar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: infracow-android-${{ env.PROFILE }}
          path: InfraCow-Mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14